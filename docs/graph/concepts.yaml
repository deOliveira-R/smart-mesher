# smart-mesh concept graph, v2 (source of truth for code boundaries)
#
# Two zoom levels:
#   domains: ~16 boxes. Read this first; it fits in a glance.
#   nodes:   well-bounded concepts inside a domain (one or a few crates each).
# Edges are "user -> provider" through a named interface. Every edge is a contract and maps to an `*-api` crate.
# The graph must stay acyclic (checked by tools/graph.py). See docs/design/ir.md §5 for the layer model.

layers:
  # MODEL: what the problem IS, independent of any discretization. Sub-layers are inseparable:
  # symmetry needs coloring (barycentres, invariants) and boundary kinds (deck vs response).
  M.shape:      "exact curves/surfaces (B-rep and CSG quadrics)"
  M.topology:   "cellular non-manifold complex; imprint/merge status per coincident face pair"
  M.coloring:   "colors on volumes (abstract material ids, exact partition) and on faces/boundaries; named groupings; no physics: the consuming code maps colors to properties"
  M.boundary:   "kind of every boundary face: deck (mirror|translation|rotation, with pairing+transform) | response (tag only) | interface"
  M.symmetry:   "deck group + fundamental domain; declared or detected; full model = unfold (derived, reversible)"
  M.instancing: "prototypes, instances, lattices: also group actions on a fundamental piece"
  # DECOMPOSITION: virtual, reversible split of the colored model into meshable pieces (same material, conceptual cuts).
  P.decomposition: "virtual cuts/composites for meshability (sweep blocks, mappable chunks); never changes coloring"
  # INTENT: how to mesh each partition cell.
  I.intent:     "sizes, intervals, schemes, vertex types, layers; reads boundary kind (deck faces get no boundary layers)"
  # MESHES (plural), all classified onto partition/model entities.
  X.mesh:       "face-first mesh tables, oriented incidences, classification, coordinates, (shape, degree, basis)"
  X.hierarchy:  "several meshes over the same model: fine + coarse levels (CMFD/AMG) with inter-mesh maps; instanced view"
  X.interfaces: "non-conformal interface records + overlap tables; deck pairings lowered from M.boundary via classification"
  # DERIVED: rebuildable caches keyed by content hashes.
  D.derived:    "tracking structure (ray tracing), geometry caches, sweep graphs, distribution (parts/ghosts)"
  # HISTORY: cross-cutting.
  H.history:    "op timeline/DAG, provenance"
  # Out of scope (confirmed 2026-10-23): material properties and response-function values. The mesher colors; consumers resolve colors.

domains:
  foundation:     {summary: "math, tolerances, exact predicates"}
  shape:          {summary: "curve/surface math, CSG quadrics, intersections",                       layers: [M.shape]}
  topology:       {summary: "cell complex + geometry operations (construct, boolean, imprint, merge, heal)", layers: [M.topology]}
  model-semantics: {summary: "coloring, boundary kinds, symmetry/deck group, instancing",            layers: [M.coloring, M.boundary, M.symmetry, M.instancing]}
  decomposition:  {summary: "virtual, reversible split into meshable pieces",                                     layers: [P.decomposition]}
  intent:         {summary: "sizing and interval solving",                                           layers: [I.intent]}
  meshing:        {summary: "meshing driver + scheme families",                                      layers: [X.mesh]}
  mesh-db:        {summary: "mesh database, classification, hierarchy, validator",                   layers: [X.mesh, X.hierarchy]}
  mesh-ops:       {summary: "quality, smoothing, modification",                                      layers: [X.mesh]}
  interfaces:     {summary: "non-conformal detection, intersection, conformize",                     layers: [X.interfaces]}
  tracking:       {summary: "ray-tracing acceleration from the known hierarchy",                     layers: [D.derived]}
  distribution:   {summary: "parallel partitioning and ownership",                                   layers: [D.derived]}
  fields:         {summary: "discretization descriptors and field data (later)"}
  io:             {summary: "native IR store, CAD/geometry import, mesh export with loss reports (no mesh import yet)"}
  history:        {summary: "ops, timeline, replay, project on disk",                                layers: [H.history]}
  frontends:      {summary: "language, server/protocol, MCP, Python, CLI, GUI"}

domain_edges:   # user -> provider
  - [shape, foundation]
  - [topology, shape]
  - [model-semantics, topology]
  - [decomposition, model-semantics]
  - [decomposition, topology]
  - [intent, decomposition]
  - [intent, model-semantics]
  - [intent, topology]
  - [mesh-db, decomposition]
  - [mesh-db, model-semantics]
  - [mesh-db, topology]
  - [meshing, mesh-db]
  - [meshing, intent]
  - [meshing, model-semantics]
  - [mesh-ops, mesh-db]
  - [mesh-ops, model-semantics]
  - [interfaces, mesh-db]
  - [interfaces, model-semantics]
  - [tracking, mesh-db]
  - [tracking, model-semantics]
  - [tracking, shape]
  - [distribution, mesh-db]
  - [fields, mesh-db]
  - [io, mesh-db]
  - [io, interfaces]
  - [io, tracking]
  - [io, distribution]
  - [io, fields]
  - [io, model-semantics]
  - [io, topology]
  - [history, "*"]
  - [frontends, history]

nodes:
  # foundation
  math:              {domain: foundation, summary: "Vectors, transforms (incl. improper), tolerance policy, intervals"}
  predicates:        {domain: foundation, summary: "Exact/adaptive orient/incircle/insphere, robust intersection tests"}
  # shape
  geom:              {domain: shape, summary: "Analytic + NURBS curves/surfaces: eval, derivatives, projection, periodicity"}
  geom-intersect:    {domain: shape, summary: "Curve/curve, curve/surface, surface/surface, ray/surface intersection"}
  csg:               {domain: shape, summary: "CSG: signed quadrics (incl. torus, general quadric), half-space cells"}
  # topology
  topo-store:        {domain: topology, summary: "Cell complex store: entities, uses (Coedge/FaceUse), sides, stable IDs, lineage"}
  construct:         {domain: topology, summary: "Primitives, bottom-up creation, extrude/revolve/sweep/loft, transforms"}
  boolean:           {domain: topology, summary: "Unite/subtract/intersect, webcut, general fuse (fragment)"}
  imprint-merge:     {domain: topology, summary: "Imprint (split so overlaps coincide) and merge (make coincident entities shared)"}
  virtual-topo:      {domain: topology, summary: "Composite/partition/collapse as a reversible overlay (cleanup)"}
  heal:              {domain: topology, summary: "Healing and defeaturing"}
  tess:              {domain: topology, summary: "Display/facet tessellation of the complex"}
  # model semantics
  coloring:          {domain: model-semantics, summary: "Material ids per volume (exact partition), blocks/assemblies, names; mixed-material cells TBD"}
  boundary-kind:     {domain: model-semantics, summary: "Deck (mirror/translation/rotation + pairing + transform) vs response (tag) vs interface, per boundary face"}
  symmetry:          {domain: model-semantics, summary: "Deck group, fundamental domain, detect (colored invariants) / declare, cut-and-keep-chamber, unfold"}
  instancing:        {domain: model-semantics, summary: "Prototype / Instance / Lattice (nestable, hex+cartesian), overrides, flatten paths"}
  # partition
  decomposition:     {domain: decomposition, summary: "Virtual cuts/composites for meshability; sweep groups; reversible; coloring-preserving"}
  # intent
  sizing:            {domain: intent, summary: "Sizes, size fields, bias; firmness; priority rules"}
  interval-solve:    {domain: intent, summary: "Global integer interval matching (incl. deck-paired curves), corner picking, vertex types"}
  # mesh-db
  mesh-store:        {domain: mesh-db, summary: "Face-first tables, oriented incidences, adjacency indexes, tags, stable ids"}
  classification:    {domain: mesh-db, summary: "Mesh entity -> (model/partition entity, params); closure rules"}
  mesh-geometry:     {domain: mesh-db, summary: "Coordinates, (shape, degree, basis) per cell, polyhedral face geometry rules"}
  mesh-hierarchy:    {domain: mesh-db, summary: "Multiple meshes per model (fine/coarse for CMFD/AMG), inter-mesh maps, instanced view, symmetric unfold"}
  validator:         {domain: mesh-db, summary: "Cross-layer invariants (classification closure, coloring partition, orientation, deck consistency, coverage)"}
  # meshing
  mesh-driver:       {domain: meshing, summary: "Dimension hierarchy, scheme selection, fallbacks, imposed child schemes, deck copy constraints"}
  scheme-curve:      {domain: meshing, summary: "equal, bias, dualbias, stretch, curvature, copy"}
  scheme-quad-structured:   {domain: meshing, summary: "map, submap, copy (incl. under deck transform), mirror"}
  scheme-quad-unstructured: {domain: meshing, summary: "paving and related"}
  scheme-tri:        {domain: meshing, summary: "Delaunay, advancing front, primitives"}
  scheme-hex:        {domain: meshing, summary: "volume map, submap, sweep, multisweep, copy"}
  scheme-tet:        {domain: meshing, summary: "Delaunay + boundary recovery + optimization"}
  scheme-poly:       {domain: meshing, summary: "polyhedral: duals, agglomeration, polyhedron scheme"}
  scheme-convert:    {domain: meshing, summary: "THex, QTri, HTet, TQuad, degree elevation"}
  boundary-layer:    {domain: meshing, summary: "inflation layers on response boundaries (never on deck boundaries)"}
  # mesh-ops
  quality:           {domain: mesh-ops, summary: "metrics (Verdict + finite-volume face metrics) and validity; diagnostics ops (sm-diag) report located, geometry-linked findings with suggested fixes"}
  smooth:            {domain: mesh-ops, summary: "smoothing/optimization/untangling; keeps mirror-plane nodes on plane, paired nodes paired (W3a: deck-pair nodes pinned)"}
  modify:            {domain: mesh-ops, summary: "refine, coarsen, pillow, collapse, remesh"}
  # interfaces
  interface-detect:  {domain: interfaces, summary: "find unmatched/coincident faces -> candidate interface records"}
  face-intersect:    {domain: interfaces, summary: "overlap polygons/areas/weights (symmetric overlap table)"}
  conformize:        {domain: interfaces, summary: "replace coarse faces by fine faces to make an interface conformal"}
  # tracking
  tracking-structure: {domain: tracking, summary: "Contract sm-rt-api (mesh-native base, decision 12): cell walking on the polyhedral mesh, BVH locate, hierarchy (lattice/instance), deck faces in-step, exact analytic refine (W3b), .smrt cache; C ABI + DAGMC shims in sm-rt-capi"}
  # distribution
  partitioner:       {domain: distribution, summary: "graph partitioning, owners, ghosts, global ids"}
  # fields
  discretization:    {domain: fields, summary: "sections, function spaces, field storage"}
  # io
  ir-store:          {domain: io, summary: "native IR: schema, physical profiles (mmap/Zarr/HDF5), versioning, validation hook"}
  cad-io:            {domain: io, summary: "Geometry import only: STEP (AP203/214/242), IGES, SAT (cq-acis as reference), STL as faceted geometry, CSG (MCNP/OpenMC); STEP export"}
  exporters:         {domain: io, summary: "one sub-node per target (CGNS, Exodus, OpenFOAM, DAGMC, VTKHDF, Gmsh, MED, OpenMC/MCNP CSG, ...), each with a loss report"}
  # history
  ops:               {domain: history, summary: "Op registry and apply(): the only way state changes"}
  timeline:          {domain: history, summary: "Op DAG, replay, snapshots, branches, project on disk"}
  state-layers:      {domain: history, summary: "shared model + meshes layers stored in the timeline State (sm-layer-api): topology/model transactions, mesh entries"}
  # frontends
  lang:              {domain: frontends, summary: "command language -> ops"}
  server:            {domain: frontends, summary: "session host + protocol"}
  mcp:               {domain: frontends, summary: "MCP tools over the protocol"}
  py:                {domain: frontends, summary: "Python bindings"}
  cli:               {domain: frontends, summary: "smesh binary"}
  gui:               {domain: frontends, summary: "web/desktop viewer and editor"}

