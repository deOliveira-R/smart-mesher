[package]
name = "sm-model"
description = "W2 T1: model primitives (brick, cylinder, sphere), rigid and similarity transforms, delete, and topology queries (topo.related, model.list, model.measure)."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-core = { path = "../sm-core" }
sm-geom-api = { path = "../sm-geom-api" }
sm-topo-api = { path = "../sm-topo-api" }
sm-model-api = { path = "../sm-model-api" }
sm-op-api = { path = "../sm-op-api" }
sm-layer-api = { path = "../sm-layer-api" }
serde = { version = "1", features = ["derive"] }
schemars = "1"
thiserror = "2"

[dev-dependencies]
sm-topo = { path = "../sm-topo" }
sm-testkit = { path = "../sm-testkit" }
sm-mesh-api = { path = "../sm-mesh-api" }
serde_json = "1"
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
