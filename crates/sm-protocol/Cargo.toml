[package]
name = "sm-protocol"
description = "The smart-mesh wire protocol (v0, unstable until W3): requests, results, errors, Endpoint."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-core = { path = "../sm-core", features = ["serde", "schemars"] }
sm-op-api = { path = "../sm-op-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

[lints]
workspace = true
