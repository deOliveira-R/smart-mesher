[package]
name = "sm-lang"
description = "The smart-mesh command language: parser, entity lists, scripts, translation to Ops."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-core = { path = "../sm-core", features = ["serde", "schemars"] }
sm-op-api = { path = "../sm-op-api" }
thiserror = "2"
serde_json = "1"
rayon = "1"

[dev-dependencies]
schemars = "1"
sm-testkit = { path = "../sm-testkit" }
serde = { version = "1", features = ["derive"] }
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "lang"
harness = false

[lints]
workspace = true
