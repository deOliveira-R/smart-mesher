[package]
name = "sm-exodus"
description = "Exodus II writer in pure Rust (own netCDF classic / 64-bit-offset encoder)."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-core = { path = "../sm-core" }
sm-mesh-api = { path = "../sm-mesh-api" }
thiserror = "2"
rayon = "1"

[dev-dependencies]
sm-testkit = { path = "../sm-testkit" }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1", default-features = false, features = ["std"] }
rayon = "1"

[[bench]]
name = "exodus"
harness = false

[lints]
workspace = true
