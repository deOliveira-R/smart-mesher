[package]
name = "sm-cadio"
description = "CAD geometry import: STEP (AP203/AP214/AP242) B-rep reader (and writer), content-addressed."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-core = { path = "../sm-core", features = ["serde", "schemars"] }
sm-geom-api = { path = "../sm-geom-api", features = ["serde", "schemars"] }
sm-topo-api = { path = "../sm-topo-api" }
sm-op-api = { path = "../sm-op-api" }
sm-layer-api = { path = "../sm-layer-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
sha2 = "0.10"
base64 = "0.22"
rayon = "1"
smallvec = "1"

[dev-dependencies]
sm-topo = { path = "../sm-topo" }
sm-testkit = { path = "../sm-testkit" }
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "perf"
harness = false

[lints]
workspace = true
