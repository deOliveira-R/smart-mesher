[package]
name = "sm-rt"
description = "Ray tracing / particle tracking: implements the sm-rt-api contract (cell walking on the polyhedral mesh, BVH locate)."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-core = { path = "../sm-core" }
sm-math = { path = "../sm-math" }
sm-geom-api = { path = "../sm-geom-api" }
sm-topo-api = { path = "../sm-topo-api" }
sm-mesh-api = { path = "../sm-mesh-api" }
sm-model-api = { path = "../sm-model-api" }
sm-rt-api = { path = "../sm-rt-api" }
sm-op-api = { path = "../sm-op-api" }
sm-layer-api = { path = "../sm-layer-api" }
rayon = "1"
smallvec = "1"
serde = { version = "1", features = ["derive"] }
schemars = "1"
serde_json = "1"

[dev-dependencies]
sm-testkit = { path = "../sm-testkit" }
sm-rt-api = { path = "../sm-rt-api", features = ["stubs"] }
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
