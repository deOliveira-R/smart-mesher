[package]
name = "sm-scheme-api"
description = "Contract between the meshing driver and every meshing scheme: multi-entity mesh jobs with footprints, atomic mesh patches, interval constraints, impositions, copy jobs and a reference driver."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
# Serialize/Deserialize on the intent types (scheme choice + params live in Ops and in git).
serde = ["dep:serde", "sm-core/serde", "sm-topo-api/serde", "sm-model-api/serde", "sm-mesh-api/serde"]

[dependencies]
sm-core = { path = "../sm-core" }
sm-geom-api = { path = "../sm-geom-api" }
sm-topo-api = { path = "../sm-topo-api" }
sm-model-api = { path = "../sm-model-api" }
sm-mesh-api = { path = "../sm-mesh-api" }
serde = { version = "1", features = ["derive"], optional = true }
smallvec = "1"
thiserror = "2"
