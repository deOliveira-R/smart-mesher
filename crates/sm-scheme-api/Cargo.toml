[package]
name = "sm-scheme-api"
description = "Contract between the meshing driver and meshing schemes: declarative constraints (vertex types, interval equations, child impositions, copy/deck equalities) assembled into a MeshingProblem, solved into a Plan, then generated as pure patches and committed in a fixed order."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
# Derive schemars::JsonSchema on the intent types (MeshIntent and everything inside it), for MCP
# tool schemas. Enables the upstream schemars features.
schemars = ["dep:schemars", "sm-core/schemars", "sm-geom-api/schemars", "sm-topo-api/schemars", "sm-model-api/schemars", "sm-mesh-api/schemars"]

# Stub schemes and fixtures (`sm_scheme_api::stubs`) for tests of this and downstream crates.
stubs = []

[dependencies]
sm-core = { path = "../sm-core", features = ["serde"] }
sm-geom-api = { path = "../sm-geom-api", features = ["serde"] }
sm-topo-api = { path = "../sm-topo-api", features = ["serde"] }
sm-model-api = { path = "../sm-model-api", features = ["serde"] }
sm-mesh-api = { path = "../sm-mesh-api", features = ["serde"] }
sm-op-api = { path = "../sm-op-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
smallvec = "1"
schemars = { version = "1", optional = true }

[dev-dependencies]
sm-scheme-api = { path = ".", features = ["stubs"] }
