[package]
name = "sm-topo-api"
description = "Cellular non-manifold topology contract for smart-mesh (radial-edge model): entities, uses, sides, lineage, query/edit traits, reference implementation."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde", "sm-core/serde", "sm-geom-api/serde"]

[dependencies]
sm-core = { path = "../sm-core" }
sm-geom-api = { path = "../sm-geom-api" }
thiserror = "2"
smallvec = "1"
indexmap = "2"
serde = { version = "1", features = ["derive"], optional = true }
