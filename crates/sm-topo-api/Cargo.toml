[package]
name = "sm-topo-api"
description = "Cellular non-manifold topology contract for smart-mesh (OCCT-like: shared handles, orientation, location, per-entity tolerance), with a reference in-memory complex."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde", "sm-core/serde", "sm-geom-api/serde", "smallvec/serde"]

[dependencies]
sm-core = { path = "../sm-core" }
sm-geom-api = { path = "../sm-geom-api" }
smallvec = "1"
thiserror = "2"
indexmap = "2"
serde = { version = "1", features = ["derive"], optional = true }
