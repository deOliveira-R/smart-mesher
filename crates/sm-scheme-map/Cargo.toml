[package]
name = "sm-scheme-map"
description = "Surface map scheme: transfinite (Coons) interpolation in the face parameter space."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-core = { path = "../sm-core" }
sm-math = { path = "../sm-math" }
sm-geom-api = { path = "../sm-geom-api" }
sm-topo-api = { path = "../sm-topo-api" }
sm-scheme-api = { path = "../sm-scheme-api" }
thiserror = "2"

[dev-dependencies]
sm-mesh-api = { path = "../sm-mesh-api" }
sm-testkit = { path = "../sm-testkit" }
sm-scheme-api = { path = "../sm-scheme-api", features = ["stubs"] }
sm-mesh = { path = "../sm-mesh" }
sm-quality = { path = "../sm-quality" }
sm-model-api = { path = "../sm-model-api" }
serde_json = "1"

[lints]
workspace = true
