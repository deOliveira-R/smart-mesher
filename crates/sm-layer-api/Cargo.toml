[package]
name = "sm-layer-api"
description = "Contract for the shared model and meshes state layers: host traits for topology and meshes, transaction helpers, and the CoreLayers plugin."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
sm-core = { path = "../sm-core" }
sm-geom-api = { path = "../sm-geom-api" }
sm-topo-api = { path = "../sm-topo-api" }
sm-model-api = { path = "../sm-model-api" }
sm-mesh-api = { path = "../sm-mesh-api" }
sm-op-api = { path = "../sm-op-api" }
sm-scheme-api = { path = "../sm-scheme-api" }
thiserror = "2"

[dev-dependencies]
sm-scheme-api = { path = "../sm-scheme-api", features = ["stubs"] }
sm-topo = { path = "../sm-topo" }
sm-mesh = { path = "../sm-mesh" }
sm-testkit = { path = "../sm-testkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

[lints]
workspace = true
