[package]
name = "sm-scheme-tri"
description = "Triangle surface schemes: constrained Delaunay with refinement (trimesh, tridelaunay) and advancing front (triadvance)."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-core = { path = "../sm-core", features = ["serde"] }
sm-math = { path = "../sm-math" }
sm-geom-api = { path = "../sm-geom-api" }
sm-topo-api = { path = "../sm-topo-api" }
sm-scheme-api = { path = "../sm-scheme-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
sm-testkit = { path = "../sm-testkit" }
sm-scheme-api = { path = "../sm-scheme-api", features = ["stubs"] }
sm-mesh-api = { path = "../sm-mesh-api" }
sm-model-api = { path = "../sm-model-api" }
sm-mesh = { path = "../sm-mesh" }
sm-quality = { path = "../sm-quality" }
sm-scheme-curve = { path = "../sm-scheme-curve" }

[lints]
workspace = true
