[package]
name = "sm-csgbrep"
description = "CSG deck to B-rep import, checks and oracle (W4 CSG-* tasks)."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-op-api = { path = "../sm-op-api" }
sm-core = { path = "../sm-core" }
sm-geom-api = { path = "../sm-geom-api" }
sm-topo-api = { path = "../sm-topo-api" }
sm-model-api = { path = "../sm-model-api" }
sm-layer-api = { path = "../sm-layer-api" }
sm-csgio = { path = "../sm-csgio" }
sm-boolean = { path = "../sm-boolean" }
sm-fem = { path = "../sm-fem" }
sm-model = { path = "../sm-model" }
sm-cadio = { path = "../sm-cadio" }
serde = { version = "1", features = ["derive"] }
schemars = "1"
base64 = "0.22"
thiserror = "2"

[dev-dependencies]
sm-topo = { path = "../sm-topo" }
serde_json = "1"
sm-server = { path = "../sm-server" }
sm-protocol = { path = "../sm-protocol" }
sm-engine = { path = "../sm-engine" }
rayon = "1"
sm-testkit = { path = "../sm-testkit" }
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
