[package]
name = "sm-model-api"
description = "Frozen contract for the model-semantics and decomposition layers: coloring, boundary kinds, symmetry (declare, detect, cut, unfold), instancing and pieces, as attribute tables over sm-topo-api."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde", "sm-core/serde", "sm-geom-api/serde", "sm-topo-api/serde", "smallvec/serde"]
# Derive schemars::JsonSchema on every serde input value type (xf, boundary, color, instancing,
# symmetry, decomposition), for MCP tool schemas.
schemars = ["serde", "dep:schemars", "sm-core/schemars", "sm-geom-api/schemars", "sm-topo-api/schemars"]

[dependencies]
sm-core = { path = "../sm-core" }
sm-geom-api = { path = "../sm-geom-api" }
sm-topo-api = { path = "../sm-topo-api" }
serde = { version = "1", features = ["derive"], optional = true }
schemars = { version = "1", optional = true, features = ["smallvec1"] }
smallvec = "1"
thiserror = "2"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
