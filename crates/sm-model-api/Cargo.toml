[package]
name = "sm-model-api"
description = "Model-semantics and decomposition layers (coloring, boundary kinds, symmetry, instancing, pieces) as attribute tables over topology. Candidate: tables."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde", "sm-core/serde", "smallvec/serde"]

[dependencies]
sm-core = { path = "../sm-core" }
serde = { version = "1", features = ["derive"], optional = true }
smallvec = "1"
thiserror = "2"
