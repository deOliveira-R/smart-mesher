[package]
name = "sm-fem"
description = "W2 skeleton: T8: blocks, sidesets, deck lowering, export."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-core = { path = "../sm-core" }
sm-topo-api = { path = "../sm-topo-api" }
sm-model-api = { path = "../sm-model-api" }
sm-mesh-api = { path = "../sm-mesh-api" }
sm-meshio = { path = "../sm-meshio" }
sm-op-api = { path = "../sm-op-api" }
sm-layer-api = { path = "../sm-layer-api" }
serde = { version = "1", features = ["derive"] }
schemars = "1"

[dev-dependencies]
sm-testkit = { path = "../sm-testkit" }
sm-scheme-api = { path = "../sm-scheme-api", features = ["stubs"] }
sm-mesh = { path = "../sm-mesh" }

[lints]
workspace = true
