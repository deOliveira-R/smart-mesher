[package]
name = "sm-fem"
description = "Blocks (volume colors), sidesets (face colors), deck lowering and mesh export."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-core = { path = "../sm-core" }
sm-topo-api = { path = "../sm-topo-api" }
sm-model-api = { path = "../sm-model-api" }
sm-mesh-api = { path = "../sm-mesh-api" }
sm-meshio = { path = "../sm-meshio" }
sm-op-api = { path = "../sm-op-api" }
sm-layer-api = { path = "../sm-layer-api" }
serde = { version = "1", features = ["derive"] }
schemars = "1"
thiserror = "2"

[dev-dependencies]
sm-testkit = { path = "../sm-testkit" }
sm-scheme-api = { path = "../sm-scheme-api", features = ["stubs"] }
sm-mesh = { path = "../sm-mesh" }
serde_json = "1"
rayon = "1"

[lints]
workspace = true
