[package]
name = "sm-decomp"
description = "Hex cut planner for round cavities: ordered webcut steps (W4 HEX-DECOMP)."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-core = { path = "../sm-core", features = ["serde", "schemars"] }
sm-geom-api = { path = "../sm-geom-api" }
sm-topo-api = { path = "../sm-topo-api" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
schemars = "1"

[dev-dependencies]
sm-testkit = { path = "../sm-testkit" }
sm-server = { path = "../sm-server" }
sm-protocol = { path = "../sm-protocol" }
sm-layer-api = { path = "../sm-layer-api" }
proptest = { version = "1", default-features = false, features = ["std"] }
rayon = "1"
serde_json = "1"

[lints]
workspace = true
