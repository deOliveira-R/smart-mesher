[package]
name = "sm-diag"
description = "Mesh validation and quality diagnostics as queries and ops: mesh.validate, mesh.quality, mesh.flag_cells."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-core = { path = "../sm-core", features = ["serde", "schemars"] }
sm-mesh-api = { path = "../sm-mesh-api", features = ["serde", "schemars"] }
sm-quality = { path = "../sm-quality" }
sm-op-api = { path = "../sm-op-api" }
sm-layer-api = { path = "../sm-layer-api" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"

[dev-dependencies]
sm-testkit = { path = "../sm-testkit" }
sm-mesh = { path = "../sm-mesh" }
sm-mesher = { path = "../sm-mesher" }
# Contract crates the shared test rig needs (bricks, stub schemes); no W3a crate.
sm-topo-api = { path = "../sm-topo-api" }
sm-scheme-api = { path = "../sm-scheme-api", features = ["stubs", "schemars"] }
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "quality"
harness = false

[lints]
workspace = true
