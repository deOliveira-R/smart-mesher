[package]
name = "sm-tess"
description = "B-rep tessellation for display: shared edge polylines, watertight face triangulations, and the view.tessellate query."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-core = { path = "../sm-core", features = ["serde", "schemars"] }
sm-geom-api = { path = "../sm-geom-api" }
sm-topo-api = { path = "../sm-topo-api" }
sm-op-api = { path = "../sm-op-api" }
sm-layer-api = { path = "../sm-layer-api" }
rayon = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
schemars = "1"

[dev-dependencies]
sm-testkit = { path = "../sm-testkit" }
serde_json = "1"
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
