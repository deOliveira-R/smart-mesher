[package]
name = "sm-cli"
description = "T12: the `smesh` binary: a thin command-line client of the smart-mesh protocol."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-protocol = { path = "../sm-protocol" }
sm-server = { path = "../sm-server" }
sm-mcp = { path = "../sm-mcp" }
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_json = "1"

[dev-dependencies]
sm-testkit = { path = "../sm-testkit" }
# Test-only: typed views of mesh/op data in the milestone and fake-server tests.
sm-op-api = { path = "../sm-op-api" }
sm-core = { path = "../sm-core" }
# Milestone row 6: decode the exported `.smsh`, validate it, and measure its quality.
sm-meshio = { path = "../sm-meshio" }
sm-mesh-api = { path = "../sm-mesh-api" }
sm-quality = { path = "../sm-quality" }
# Milestone: MCP text content may use the script spelling of ids (sm-mcp `respell` feature).
sm-lang = { path = "../sm-lang" }
# W3a milestone (tests/milestone_w3a.rs): in-process meshes and models (rows 6-13), the Exodus
# test decoder (row 10), the dual report (row 11), the tracker (row 13).
sm-layer-api = { path = "../sm-layer-api" }
sm-mesh = { path = "../sm-mesh" }
sm-exodus = { path = "../sm-exodus" }
sm-poly = { path = "../sm-poly" }
sm-rt = { path = "../sm-rt" }
sm-rt-api = { path = "../sm-rt-api" }
sm-geom-api = { path = "../sm-geom-api" }
sm-topo-api = { path = "../sm-topo-api" }
# Row 13: trace the same bundle in a 1-thread and an N-thread pool.
rayon = "1"

[[bin]]
name = "smesh"
path = "src/main.rs"

[lints]
workspace = true
