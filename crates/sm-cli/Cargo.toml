[package]
name = "sm-cli"
description = "T12: the `smesh` binary: a thin command-line client of the smart-mesh protocol."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-protocol = { path = "../sm-protocol" }
sm-server = { path = "../sm-server" }
sm-mcp = { path = "../sm-mcp" }
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_json = "1"

[dev-dependencies]
sm-testkit = { path = "../sm-testkit" }
# Test-only: typed views of mesh/op data in the milestone and fake-server tests.
sm-op-api = { path = "../sm-op-api" }
sm-core = { path = "../sm-core" }
# Milestone row 6: decode the exported `.smsh`, validate it, and measure its quality.
sm-meshio = { path = "../sm-meshio" }
sm-mesh-api = { path = "../sm-mesh-api" }
sm-quality = { path = "../sm-quality" }
# Milestone: MCP text content may use the script spelling of ids (sm-mcp `respell` feature).
sm-lang = { path = "../sm-lang" }

[[bin]]
name = "smesh"
path = "src/main.rs"

[lints]
workspace = true
