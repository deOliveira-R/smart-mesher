[package]
name = "sm-scheme-pave"
description = "Unstructured all-quad surface scheme (paving): metric-corrected constrained Delaunay, frontal points, blossom recombination."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-core = { path = "../sm-core" }
sm-math = { path = "../sm-math" }
sm-geom-api = { path = "../sm-geom-api" }
sm-topo-api = { path = "../sm-topo-api" }
sm-scheme-api = { path = "../sm-scheme-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
sm-mesh-api = { path = "../sm-mesh-api" }
sm-model-api = { path = "../sm-model-api" }
sm-quality = { path = "../sm-quality" }
sm-testkit = { path = "../sm-testkit" }
sm-scheme-api = { path = "../sm-scheme-api", features = ["stubs"] }

[lints]
workspace = true
