[package]
name = "sm-scheme-ogrid"
description = "O-grid surface scheme: structured ring decomposition of circular faces (W4 HEX-OGRID)."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-core = { path = "../sm-core" }
sm-topo-api = { path = "../sm-topo-api" }
sm-scheme-api = { path = "../sm-scheme-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
sm-server = { path = "../sm-server" }
sm-protocol = { path = "../sm-protocol" }
serde_json = "1"
sm-testkit = { path = "../sm-testkit" }
rayon = "1"
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
