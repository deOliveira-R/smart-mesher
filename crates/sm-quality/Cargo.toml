[package]
name = "sm-quality"
description = "Mesh quality metrics (Verdict-equivalent set) and validity checks."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
sm-core = { path = "../sm-core" }
sm-mesh-api = { path = "../sm-mesh-api" }
thiserror = "2"
rayon = "1"
smallvec = "1"

[dev-dependencies]
sm-testkit = { path = "../sm-testkit" }
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "metrics"
harness = false

[lints]
workspace = true
