<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smart-mesh viewer</title>
<style>
  :root { color-scheme: dark light; --bg:#14161a; --fg:#e6e8eb; --dim:#8b929c; --line:#2a2e35; --panel:#1b1e23; --accent:#ffaa28; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f5f7; --fg:#1b1e23; --dim:#666e78; --line:#d4d8de; --panel:#fff; } }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui, sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; }
  header { padding:6px 12px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  main { flex:1; display:flex; min-height:0; }
  .viewport { flex:1; position:relative; min-width:0; }
  canvas { width:100%; height:100%; display:block; touch-action:none; }
  .info { position:absolute; left:8px; bottom:8px; background:var(--panel); padding:2px 8px; border-radius:4px; opacity:.9; }
  aside { width:300px; overflow:auto; border-left:1px solid var(--line); background:var(--panel); padding:0 12px 12px; }
  h3 { margin:12px 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); }
  label { display:block; }
  .mono { font-family:ui-monospace, Menlo, monospace; font-size:12px; }
  .pill { border:1px solid var(--line); border-radius:10px; padding:0 8px; }
  .dim { color:var(--dim); }
  .list { max-height:160px; overflow:auto; border:1px solid var(--line); border-radius:4px; }
  .row { padding:2px 6px; cursor:pointer; border-bottom:1px solid var(--line); }
  .row:hover, .row.sel { background:rgba(255,170,40,.18); }
  .row.error b { color:#e5484d; } .row.warning b { color:#f5a524; }
  .swatch { display:inline-block; width:10px; height:10px; margin:0 4px; border:1px solid var(--line); }
  .console { height:90px; overflow:auto; margin:4px 0 0; border:1px solid var(--line); padding:4px; white-space:pre-wrap; }
  input[type=text] { width:100%; box-sizing:border-box; }
  .suggest pre { white-space:pre-wrap; margin:4px 0; }
  .status { color:#e5484d; margin-top:8px; }
  @media (max-width:700px) { main { flex-direction:column; } aside { width:auto; max-height:45%; border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="viewer.js"></script>
</body>
</html>
