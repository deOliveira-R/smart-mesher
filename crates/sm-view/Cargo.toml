[package]
name = "sm-view"
description = "Renderer-neutral view buffers (skin, clip, scalar overlays) and the web viewer client in web/."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-core = { path = "../sm-core", features = ["serde", "schemars"] }
sm-mesh-api = { path = "../sm-mesh-api", features = ["serde", "schemars"] }
sm-topo-api = { path = "../sm-topo-api" }
sm-model-api = { path = "../sm-model-api" }
sm-quality = { path = "../sm-quality" }
sm-op-api = { path = "../sm-op-api" }
sm-layer-api = { path = "../sm-layer-api" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
schemars = "1"
thiserror = "2"

[dev-dependencies]
sm-testkit = { path = "../sm-testkit" }
sm-mesh = { path = "../sm-mesh" }
serde_json = "1"
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
