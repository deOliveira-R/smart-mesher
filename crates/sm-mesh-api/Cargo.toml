[package]
name = "sm-mesh-api"
description = "Frozen contract for the mesh database (face-first topology, classification, high order, hierarchy) with an in-memory reference implementation."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = []
# Derive Serialize/Deserialize on the plain value types (EntityId serializes as "Kind#serial").
serde = ["dep:serde", "sm-core/serde"]

[dependencies]
sm-core = { path = "../sm-core" }
thiserror = "2"
indexmap = "2"
smallvec = "1"
serde = { version = "1", features = ["derive"], optional = true }

[lints]
workspace = true
