[package]
name = "sm-mesh-api"
description = "Contract for the smart-mesh mesh database: face-first tables, classification, tags/sets, hierarchy, plus an in-memory reference implementor."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
sm-core = { path = "../sm-core" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
smallvec = "1"
indexmap = { version = "2", features = ["serde"] }

[lints]
workspace = true
