[package]
name = "sm-geom"
description = "Geometry kernel: analytic and NURBS curves and surfaces, evaluation, projection and intersection."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
# Forward serde to the contract crate (store persistence).
serde = ["sm-geom-api/serde", "dep:serde"]

[dependencies]
sm-core = { path = "../sm-core" }
sm-geom-api = { path = "../sm-geom-api" }
smallvec = "1"
rayon = "1"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
sm-testkit = { path = "../sm-testkit" }
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "hot_path"
harness = false

[lints]
workspace = true
