[package]
name = "sm-topo"
description = "Cellular non-manifold B-rep store implementing sm-topo-api, with Euler operators, stable ids and lineage."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
sm-core = { path = "../sm-core" }
sm-geom-api = { path = "../sm-geom-api" }
sm-topo-api = { path = "../sm-topo-api" }
smallvec = "1"
rayon = "1"

[dev-dependencies]
serde_json = "1"
sm-testkit = { path = "../sm-testkit" }
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "scaling"
harness = false

[lints]
workspace = true
