[package]
name = "sm-geom-api"
description = "Frozen contract for exact shape: parametric curves/surfaces, analytic kinds, NURBS data, CSG quadrics, ray hooks, tolerance policy."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde", "sm-core/serde", "smallvec/serde"]
# Derive schemars::JsonSchema on the serde value types (MCP tool schemas).
schemars = ["serde", "dep:schemars", "sm-core/schemars"]

[dependencies]
sm-core = { path = "../sm-core" }
serde = { version = "1", features = ["derive"], optional = true }
schemars = { version = "1", optional = true }
thiserror = "2"
smallvec = "1"

[dev-dependencies]
serde_json = "1"
