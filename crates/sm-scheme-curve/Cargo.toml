[package]
name = "sm-scheme-curve"
description = "Curve meshing schemes: equal, bias, dualbias, stretch, curvature (arc-length spacing converted to parameter fractions)."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-core = { path = "../sm-core", features = ["serde"] }
sm-geom-api = { path = "../sm-geom-api" }
sm-topo-api = { path = "../sm-topo-api" }
sm-scheme-api = { path = "../sm-scheme-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"

[dev-dependencies]
sm-testkit = { path = "../sm-testkit" }
sm-scheme-api = { path = "../sm-scheme-api", features = ["stubs"] }
sm-mesh = { path = "../sm-mesh" }
sm-mesh-api = { path = "../sm-mesh-api" }

[lints]
workspace = true
