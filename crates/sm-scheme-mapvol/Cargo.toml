[package]
name = "sm-scheme-mapvol"
description = "Volume map scheme: six structured faces, 3-D transfinite interpolation, hexahedra."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-core = { path = "../sm-core" }
sm-topo-api = { path = "../sm-topo-api" }
sm-scheme-api = { path = "../sm-scheme-api" }
# Contract crate, already a dependency of sm-scheme-api: `CellShape::Hex` for the patch elements.
sm-mesh-api = { path = "../sm-mesh-api" }
rayon = "1"

[dev-dependencies]
sm-geom-api = { path = "../sm-geom-api" }
sm-testkit = { path = "../sm-testkit" }
sm-scheme-api = { path = "../sm-scheme-api", features = ["stubs"] }
sm-mesh = { path = "../sm-mesh" }
sm-mesh-api = { path = "../sm-mesh-api", features = ["serde"] }
sm-model-api = { path = "../sm-model-api" }
sm-quality = { path = "../sm-quality" }

[lints]
workspace = true
