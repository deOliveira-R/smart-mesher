[package]
name = "sm-meshio"
description = "Mesh export: native .smsh container and VTU, later Exodus, CGNS, Gmsh and others."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
# Memory-mapped file access for the .smsh reader (needs `unsafe` in memmap2).
mmap = ["dep:memmap2"]

[dependencies]
sm-core = { path = "../sm-core" }
sm-mesh-api = { path = "../sm-mesh-api", features = ["bytemuck"] }
sm-model-api = { path = "../sm-model-api" }
thiserror = "2"
rayon = "1"
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
memmap2 = { version = "0.9", optional = true }

[dev-dependencies]
sm-testkit = { path = "../sm-testkit" }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rayon = "1"

[[bench]]
name = "export"
harness = false

[lints]
workspace = true
