[package]
name = "sm-server"
description = "Session host, protocol endpoint, transports and the standard distribution."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[features]
# WebSocket transport (one JSON-RPC message per text frame).
ws = ["dep:tungstenite"]

[dependencies]
sm-core = { path = "../sm-core" }
sm-op-api = { path = "../sm-op-api" }
sm-engine = { path = "../sm-engine" }
sm-lang = { path = "../sm-lang" }
sm-protocol = { path = "../sm-protocol" }
sm-layer-api = { path = "../sm-layer-api" }
sm-fem = { path = "../sm-fem" }
sm-model = { path = "../sm-model" }
sm-mesher = { path = "../sm-mesher" }
sm-sizing = { path = "../sm-sizing" }
sm-scheme-curve = { path = "../sm-scheme-curve" }
sm-scheme-map = { path = "../sm-scheme-map" }
sm-scheme-mapvol = { path = "../sm-scheme-mapvol" }
sm-tess = { path = "../sm-tess" }
sm-topo = { path = "../sm-topo" }
sm-topo-api = { path = "../sm-topo-api" }
sm-scheme-api = { path = "../sm-scheme-api" }
sm-scheme-submap = { path = "../sm-scheme-submap" }
sm-scheme-pave = { path = "../sm-scheme-pave" }
sm-scheme-tri = { path = "../sm-scheme-tri" }
sm-scheme-sweep = { path = "../sm-scheme-sweep" }
sm-scheme-tet = { path = "../sm-scheme-tet" }
sm-scheme-ogrid = { path = "../sm-scheme-ogrid" }
sm-csgbrep = { path = "../sm-csgbrep" }
sm-modify = { path = "../sm-modify" }
sm-boolean = { path = "../sm-boolean" }
sm-cadio = { path = "../sm-cadio" }
sm-smooth = { path = "../sm-smooth" }
sm-poly = { path = "../sm-poly" }
sm-diag = { path = "../sm-diag" }
sm-rt = { path = "../sm-rt" }
sm-rt-api = { path = "../sm-rt-api" }
sm-view = { path = "../sm-view" }
sm-meshio = { path = "../sm-meshio" }
sm-model-api = { path = "../sm-model-api" }
serde = "1"
serde_json = "1"
thiserror = "2"
tungstenite = { version = "0.30", optional = true }

[dev-dependencies]
sm-testkit = { path = "../sm-testkit" }
sm-mesh-api = { path = "../sm-mesh-api" }
sm-scheme-api = { path = "../sm-scheme-api", features = ["stubs"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
rayon = "1"
sm-geom-api = { path = "../sm-geom-api" }
# The CLI and MCP front ends drive the same Server in the export-wiring tests (a dev-only cycle).
sm-cli = { path = "../sm-cli" }
sm-mcp = { path = "../sm-mcp" }
base64 = "0.22"

[lints]
workspace = true
