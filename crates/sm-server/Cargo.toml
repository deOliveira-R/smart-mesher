[package]
name = "sm-server"
description = "Session host, protocol endpoint, transports and the standard distribution."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[features]
# WebSocket transport (one JSON-RPC message per text frame).
ws = ["dep:tungstenite"]

[dependencies]
sm-core = { path = "../sm-core" }
sm-op-api = { path = "../sm-op-api" }
sm-engine = { path = "../sm-engine" }
sm-lang = { path = "../sm-lang" }
sm-protocol = { path = "../sm-protocol" }
sm-layer-api = { path = "../sm-layer-api" }
sm-fem = { path = "../sm-fem" }
sm-model = { path = "../sm-model" }
sm-mesher = { path = "../sm-mesher" }
sm-sizing = { path = "../sm-sizing" }
sm-scheme-curve = { path = "../sm-scheme-curve" }
sm-scheme-map = { path = "../sm-scheme-map" }
sm-scheme-mapvol = { path = "../sm-scheme-mapvol" }
sm-tess = { path = "../sm-tess" }
sm-topo = { path = "../sm-topo" }
sm-topo-api = { path = "../sm-topo-api" }
sm-scheme-api = { path = "../sm-scheme-api" }
serde = "1"
serde_json = "1"
thiserror = "2"
tungstenite = { version = "0.30", optional = true }

[dev-dependencies]
sm-testkit = { path = "../sm-testkit" }
sm-mesh-api = { path = "../sm-mesh-api" }
sm-meshio = { path = "../sm-meshio" }
sm-scheme-api = { path = "../sm-scheme-api", features = ["stubs"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
rayon = "1"

[lints]
workspace = true
