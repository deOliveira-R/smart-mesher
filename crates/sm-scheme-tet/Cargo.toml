[package]
name = "sm-scheme-tet"
description = "Tetrahedral volume scheme: Delaunay insertion, boundary recovery, refinement, optimization."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-core = { path = "../sm-core" }
sm-math = { path = "../sm-math" }
sm-topo-api = { path = "../sm-topo-api" }
sm-mesh-api = { path = "../sm-mesh-api" }
sm-scheme-api = { path = "../sm-scheme-api" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
sm-testkit = { path = "../sm-testkit" }
sm-scheme-api = { path = "../sm-scheme-api", features = ["stubs"] }
sm-mesh = { path = "../sm-mesh" }
sm-quality = { path = "../sm-quality" }
sm-model-api = { path = "../sm-model-api" }
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "tet"
harness = false

[lints]
workspace = true
