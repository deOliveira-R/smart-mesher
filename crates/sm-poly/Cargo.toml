[package]
name = "sm-poly"
description = "Tet to polyhedral conversion (median dual with boundary and feature handling; optional agglomeration)."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[features]
# Test hook (`with_unchecked_merges`) that skips the agglomeration validity check so the
# post-agglomeration error can be exercised. Off in production builds; enabled for this crate's tests.
test-hooks = []

[dependencies]
sm-core = { path = "../sm-core" }
sm-mesh-api = { path = "../sm-mesh-api" }
sm-mesh = { path = "../sm-mesh" }
sm-op-api = { path = "../sm-op-api" }
sm-layer-api = { path = "../sm-layer-api" }
sm-topo-api = { path = "../sm-topo-api" }
rayon = "1"
thiserror = "2"
smallvec = "1"
serde = { version = "1", features = ["derive"] }
schemars = "1"

[dev-dependencies]
sm-poly = { path = ".", features = ["test-hooks"] }
sm-testkit = { path = "../sm-testkit" }
sm-quality = { path = "../sm-quality" }
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.5", default-features = false }
serde_json = "1"

[[bench]]
name = "dualize"
harness = false

[lints]
workspace = true
