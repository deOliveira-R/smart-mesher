[package]
name = "sm-mesher"
description = "The intent and meshes plugin and the mesh-driver node: mesh.size/intervals/scheme/run/delete, mesh.info, IntentLayer, MesherConfig."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-core = { path = "../sm-core" }
sm-topo-api = { path = "../sm-topo-api" }
sm-model-api = { path = "../sm-model-api" }
sm-mesh-api = { path = "../sm-mesh-api" }
sm-mesh = { path = "../sm-mesh" }
sm-scheme-api = { path = "../sm-scheme-api", features = ["schemars"] }
sm-op-api = { path = "../sm-op-api" }
sm-layer-api = { path = "../sm-layer-api" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

[dev-dependencies]
sm-testkit = { path = "../sm-testkit" }
sm-scheme-api = { path = "../sm-scheme-api", features = ["stubs", "schemars"] }
sm-quality = { path = "../sm-quality" }
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "commit"
harness = false

[lints]
workspace = true
