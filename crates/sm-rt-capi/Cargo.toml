[package]
name = "sm-rt-capi"
description = "C ABI over sm-rt-api trackers for Fortran/C++ transport codes, plus DAGMC-shaped shims."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# The C library is `libsm_rt_capi` (cdylib + staticlib); the rlib serves Rust embedding and tests.
crate-type = ["rlib", "cdylib", "staticlib"]
bench = false

[features]
default = ["sm-rt"]
# Test-only exports (`smrt_test_*`) that build stub trackers for the C tests; pulls the contract stub.
stubs = ["sm-rt-api/stubs"]
# Loader for `smrt_open` (`sm_rt::load_image`). On by default; without it `smrt_open` returns
# `SMRT_ERR_UNSUPPORTED`.
sm-rt = ["dep:sm-rt"]

[dependencies]
sm-rt-api = { path = "../sm-rt-api" }
# Contract crates whose types appear in the `Tracker` signatures (`Point3`, `Vector3`, `Ray`).
sm-core = { path = "../sm-core" }
sm-geom-api = { path = "../sm-geom-api" }
rayon = "1"
sm-rt = { path = "../sm-rt", optional = true }

[dev-dependencies]
sm-rt-api = { path = "../sm-rt-api", features = ["stubs"] }
sm-testkit = { path = "../sm-testkit" }
sm-rt = { path = "../sm-rt" }
sm-mesh-api = { path = "../sm-mesh-api" }
cc = "1"

[lints]
workspace = true

[[example]]
name = "rt_capi_bench"
required-features = ["stubs"]
