[package]
name = "sm-modify"
description = "Mesh modification ops: hex to tet, quad to tri, uniform and local refinement (W4 MOD-* tasks)."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
sm-core = { path = "../sm-core" }
sm-geom-api = { path = "../sm-geom-api" }
sm-mesh = { path = "../sm-mesh" }
sm-mesh-api = { path = "../sm-mesh-api" }
sm-op-api = { path = "../sm-op-api" }
sm-layer-api = { path = "../sm-layer-api" }
sm-quality = { path = "../sm-quality" }
sm-topo-api = { path = "../sm-topo-api" }
rayon = "1"
thiserror = "2"
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

[dev-dependencies]
sm-testkit = { path = "../sm-testkit" }
sm-server = { path = "../sm-server" }
sm-protocol = { path = "../sm-protocol" }
sm-engine = { path = "../sm-engine" }
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
